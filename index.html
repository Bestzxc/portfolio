<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — Thanapol Intasuwan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <!-- ── NAV ── -->
  <nav id="navbar">
    <a href="#hero" class="nav-logo">PORTFOLIO</a>
    <ul class="nav-links">
      <li><a href="#about">About</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#certificates">Certificates</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#activities">Activities</a></li>
      <li><a href="#footer">Contact</a></li>
    </ul>
  </nav>

  <!-- ── HERO ── -->
  <section id="hero">
    <div class="hero-bg"></div>
    <div class="hero-lines"></div>
    <div class="hero-left">
      <p class="hero-eyebrow" id="hero-status"></p>
      <h1 class="hero-name" id="hero-name"></h1>
      <p class="hero-title" id="hero-title"></p>
      <div class="hero-cta">
        <a href="#projects" class="btn-primary"><span>View Projects</span></a>
        <a href="#footer" class="btn-ghost">Contact Me</a>
      </div>
    </div>
    <div class="hero-right">
      <div class="hero-visual">
        <div class="avatar-frame">
          <img id="hero-avatar" src="" alt="" class="avatar-img" />
        </div>
        <div class="frame-deco frame-deco-1"></div>
        <div class="frame-deco frame-deco-2"></div>
      </div>
    </div>
  </section>

  <!-- ── ABOUT ── -->
  <section id="about">
    <div class="section-header reveal">
      <span class="section-num">01</span>
      <h2 class="section-title">About Me</h2>
      <div class="section-line"></div>
    </div>
    <div class="about-grid">
      <div class="about-cards reveal" id="about-list"></div>
      <div class="about-stats reveal" id="about-stats"></div>
    </div>
  </section>

  <!-- ── SKILLS ── -->
  <section id="skills">
    <div class="section-header reveal">
      <span class="section-num">02</span>
      <h2 class="section-title">Skills</h2>
      <div class="section-line"></div>
    </div>
    <div class="skills-grid reveal">
      <div class="skill-category">
        <div class="skill-cat-title">Programming Languages</div>
        <div class="skill-blocks" id="skills-languages"></div>
      </div>
      <div class="skill-category">
        <div class="skill-cat-title">Soft Skills</div>
        <div class="skill-list">
          <div class="skill-item" id="skills-soft"></div>
        </div>
      </div>
      <div class="skill-category">
        <div class="skill-cat-title">IDE & Tools</div>
        <div class="skill-blocks" id="skills-tools"></div>
      </div>
      <div class="skill-category skill-category-wide">
        <div class="skill-cat-title">Languages</div>
        <div class="skill-blocks languages-blocks" id="skills-spoken"></div>
        <div class="skill-cat-subtitle">AI Tools</div>
        <div class="skill-blocks ai-blocks" id="skills-ai"></div>
      </div>
    </div>
  </section>

  <!-- ── CERTIFICATES ── -->
  <section id="certificates">
    <div class="section-header reveal">
      <span class="section-num">03</span>
      <h2 class="section-title">Certificates</h2>
      <div class="section-line"></div>
    </div>
    <div class="certificates-grid reveal" id="certificates-grid"></div>
  </section>

  <!-- ── PROJECTS ── -->
  <section id="projects">
    <div class="section-header reveal">
      <span class="section-num">04</span>
      <h2 class="section-title">Projects</h2>
      <div class="section-line"></div>
    </div>
    <div class="projects-grid reveal" id="projects-grid"></div>
  </section>

  <!-- ── ACTIVITIES ── -->
  <section id="activities">
    <div class="section-header reveal">
      <span class="section-num">05</span>
      <h2 class="section-title">Activities</h2>
      <div class="section-line"></div>
    </div>
    <div class="activities-carousel">
      <button class="activity-nav prev" aria-label="Previous activity">‹</button>
      <div class="activities-track" id="activities-track"></div>
      <button class="activity-nav next" aria-label="Next activity">›</button>
    </div>
  </section>

  <!-- ── [CONTACT MOVED TO FOOTER] ── -->
  <!-- ── FOOTER ── -->
  <footer id="footer">
    <div class="footer-contact">
      <h3>Contact :</h3>
      <div class="footer-contact-inner">
        <div class="contact-links-footer" id="footer-contacts"></div>
      </div>
    </div>
    <span class="footer-copy" id="footer-note"></span>
    <a href="#hero" class="footer-back">Back to top ↑</a>
  </footer>

  <!-- Load order matters: data first, then the code that renders it -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="" />
  </div>

  <script src="data.js"></script>
  <script src="render.js"></script>
  <script src="script.js"></script>
</body>

</html>
